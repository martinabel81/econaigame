<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Gradient Descent</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: graph-paper study notebook; sticky arcade top bar; one column of chunky "arcade" cards that stacks on phones. */
:root{
  --paper:#EDF1F6; --grid:#DDE4EE; --card:#FFFFFF; --card2:#F5F8FC; --ink:#18233F; --muted:#56637E; --line:#C9D3E1;
  --hi:#FFE04A; --hi-ink:#332800; --coral:#E8503F; --mint:#16996C; --sky:#2F6FD6; --trap:#9B6BE6; --gold:#E7A919;
  --ok-bg:#E2F6EE; --bad-bg:#FDE8E5;
  --f-display:'Bungee','Arial Black',Impact,system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1628; --grid:#18213B; --card:#18213A; --card2:#1E2845; --ink:#E8EDF8; --muted:#9AA7C2; --line:#2D3A5E;
  --hi:#FFD83A; --hi-ink:#2A2100; --coral:#FF7867; --mint:#3DD6A0; --sky:#76A7F7; --trap:#C3A2FF; --gold:#FFC53D;
  --ok-bg:#123A2E; --bad-bg:#3E1D1F; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1628; --grid:#18213B; --card:#18213A; --card2:#1E2845; --ink:#E8EDF8; --muted:#9AA7C2; --line:#2D3A5E;
  --hi:#FFD83A; --hi-ink:#2A2100; --coral:#FF7867; --mint:#3DD6A0; --sky:#76A7F7; --trap:#C3A2FF; --gold:#FFC53D;
  --ok-bg:#123A2E; --bad-bg:#3E1D1F; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:2px solid var(--ink)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-size:19px;letter-spacing:.5px;background:none;border:0;cursor:pointer;padding:0;display:flex;align-items:center;gap:8px}
.logo small{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:0}
.nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.nav button{background:transparent;border:2px solid transparent;border-radius:10px;padding:5px 10px;cursor:pointer;font-weight:700;font-size:14px}
.nav button:hover{border-color:var(--line)}
.nav button[aria-current="true"]{border-color:var(--ink);background:var(--card2)}
.tok{font-family:var(--f-mono);font-weight:600;background:var(--hi);color:var(--hi-ink);border:2px solid var(--ink);border-radius:999px;padding:3px 12px 3px 6px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tok i{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--hi);font-style:normal;font-size:11px}
.tok.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.18)}}

main{padding-block:22px 60px}
section[data-screen]{display:grid;gap:18px}

.card{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:18px;box-shadow:0 4px 0 var(--ink)}
.soft{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);border-radius:12px;padding:9px 16px;font-weight:700;cursor:pointer;background:var(--card);box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.pri{background:var(--hi);color:var(--hi-ink)}
.btn.ghost{box-shadow:none;border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.sm{padding:5px 10px;font-size:14px;border-radius:10px}
.chip{font-family:var(--f-mono);font-size:12px;font-weight:600;border:1.5px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--card2);white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;align-items:stretch}
.goatcard{display:grid;gap:10px;justify-items:center;text-align:center}
.goatcard svg{width:190px;height:auto}
.goat-bob{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
.goat-hop{animation:hop .6s}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes hop{30%{transform:translateY(-26px) rotate(-4deg)}60%{transform:translateY(0)}}
.bubble{background:var(--card2);border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:15px;max-width:260px;min-height:44px}
.title-big{font-family:var(--f-display);font-size:clamp(30px,6vw,54px);line-height:1;letter-spacing:.5px}
.title-big span{background:var(--hi);color:var(--hi-ink);padding:0 .15em;border-radius:6px}
.intro{display:grid;gap:12px;align-content:start}
.intro p{margin:0;max-width:62ch}
.units{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.unit{text-align:left;cursor:pointer;display:grid;gap:10px;align-content:start;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:16px;box-shadow:0 4px 0 var(--ink)}
.unit:hover{transform:translateY(-2px)}
.unit h3{font-family:var(--f-display);font-size:18px;font-weight:400}
.ubadge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;border:2px solid var(--ink)}
.meter{height:10px;background:var(--card2);border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.meter b{display:block;height:100%;background:var(--mint);border-radius:999px;transition:width .5s}
.lbars{display:flex;gap:4px;align-items:flex-end;height:46px}
.lbars div{flex:1;min-width:0;display:grid;gap:2px;justify-items:center}
.lbars span{display:block;width:100%;background:var(--card2);border:1px solid var(--line);border-radius:4px;height:32px;position:relative;overflow:hidden}
.lbars span b{position:absolute;inset:auto 0 0 0;background:var(--mint)}
.lbars em{font-style:normal;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.savebar{width:100%;display:grid;gap:4px;text-align:left;font-size:13px}

/* unit */
.uhead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--card);padding:8px 14px;cursor:pointer;font-weight:700;display:grid;text-align:left;line-height:1.2}
.seg button small{font-weight:400;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.seg button[aria-pressed="true"] small{color:var(--card)}
.lchips{display:flex;gap:6px;flex-wrap:wrap}
.lchip{font-family:var(--f-mono);font-size:13px;font-weight:600;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:4px 10px;cursor:pointer}
.lchip[aria-pressed="true"]{border-color:var(--ink);background:var(--hi);color:var(--hi-ink)}
.lchip:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.game{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;text-align:left;align-items:start;cursor:pointer;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:14px;box-shadow:0 4px 0 var(--ink)}
.game:hover{transform:translateY(-2px)}
.game .gi{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:28px;border:2px solid var(--ink)}
.game h3{font-size:17px}
.game p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.game.boss{background:var(--ink);color:var(--card)}
.game.boss p{color:var(--card);opacity:.8}

/* play */
.playhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.playhead h2{font-family:var(--f-display);font-weight:400;font-size:20px}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:var(--card)}
.dots i.ok{background:var(--mint)} .dots i.half{background:var(--gold)} .dots i.no{background:var(--coral)} .dots i.cur{background:var(--hi)}
.prompt{font-size:clamp(17px,2.3vw,21px);line-height:1.45;max-width:70ch}
.prompt .lab{display:block;margin-bottom:4px}
.jack{display:inline-block;font-family:var(--f-display);font-size:13px;background:var(--gold);color:#2a1a00;border:2px solid var(--ink);border-radius:8px;padding:2px 8px;animation:wig 1.2s infinite}
@keyframes wig{50%{transform:rotate(-3deg)}}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.sky{position:relative;height:400px;border:2px solid var(--ink);border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg,color-mix(in srgb,var(--sky) 22%,var(--card)) 0%,var(--card) 100%)}
.balloon{position:absolute;bottom:-170px;width:122px;display:grid;justify-items:center;cursor:pointer;border:0;background:none;padding:0;animation:rise var(--d,9s) linear infinite;animation-delay:var(--dl,0s)}
.balloon:hover,.balloon:focus-visible{animation-play-state:paused;z-index:3}
@keyframes rise{from{bottom:-170px}to{bottom:105%}}
.balloon .bb{width:118px;height:96px;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;display:grid;place-items:center;padding:8px 10px;font-weight:700;font-size:13.5px;line-height:1.2;color:#1a1a22;border:2px solid rgba(0,0,0,.35);box-shadow:inset -10px -10px 0 rgba(0,0,0,.08),inset 8px 8px 0 rgba(255,255,255,.35);text-align:center;animation:sway 2.6s ease-in-out infinite;overflow-wrap:anywhere}
.balloon .st{width:2px;height:54px;background:var(--muted)}
.balloon .kn{width:10px;height:7px;background:inherit;clip-path:polygon(50% 0,100% 100%,0 100%)}
@keyframes sway{50%{transform:rotate(4deg) translateX(4px)}}
.balloon.trap .bb{background:repeating-linear-gradient(135deg,#E9DDFF 0 10px,#D6C3FF 10px 20px)!important;}
.balloon.popped{animation:none;pointer-events:none}
.balloon.popped .bb{animation:popit .35s forwards}
@keyframes popit{60%{transform:scale(1.35);opacity:.6}to{transform:scale(.1);opacity:0}}
.balloon.popped .st{opacity:0}
.balloon.glow .bb{outline:4px solid var(--gold);outline-offset:3px}
.balloon.gone{visibility:hidden}
.sky.static{height:auto;display:flex;flex-wrap:wrap;gap:12px;padding:16px;justify-content:center}
.sky.static .balloon{position:static;animation:none}
.sky.static .balloon .bb{animation:none}

.field{position:relative;height:380px;border:2px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--card2)}
.drop{position:absolute;left:50%;transform:translateX(-50%);top:0;width:min(300px,82%);background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:10px 14px;font-weight:700;text-align:center;box-shadow:0 3px 0 var(--ink)}
.drop.gold{background:var(--gold);color:#2a1a00}
.drop.fly{transition:all .35s ease-in;opacity:.2}
.buckets{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;padding:8px}
.bucket{flex:1;min-width:0;height:96px;border:2px solid var(--ink);border-top-width:5px;border-radius:6px 6px 22px 22px;cursor:pointer;display:grid;align-content:center;justify-items:center;gap:2px;padding:6px;font-weight:700;font-size:14px;line-height:1.15;text-align:center;clip-path:polygon(0 0,100% 0,92% 100%,8% 100%)}
.bucket .n{font-family:var(--f-mono);font-size:12px;opacity:.75}
.bucket.hit{animation:bump .35s}
.bucket.wrongb{animation:shake .35s}
.flash{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:22px;pointer-events:none;animation:flash 1s forwards;white-space:nowrap}
@keyframes flash{to{opacity:0;transform:translate(-50%,-130%)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mcard{min-height:104px;border:2px solid var(--ink);border-radius:12px;cursor:pointer;padding:8px;font-size:13.5px;line-height:1.3;display:grid;place-items:center;text-align:center;background:var(--ink);color:var(--card);font-weight:700;transition:transform .25s;overflow-wrap:anywhere}
.mcard.up{background:var(--card);color:var(--ink);transform:rotateY(0)}
.mcard.study.up{background:color-mix(in srgb,var(--sky) 14%,var(--card))}
.mcard.done{background:var(--ok-bg);color:var(--ink);cursor:default;border-color:var(--mint)}
.mcard.done.jp{border-color:var(--gold);border-width:3px}
.mcard.bad{animation:shake .35s}
.mcard .back{font-family:var(--f-display);font-size:20px;font-weight:400;color:var(--hi)}

.claims{display:grid;gap:12px}
.claim{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;text-align:left;border:2px solid var(--ink);border-radius:14px;padding:14px;background:var(--card);cursor:pointer;font-size:16.5px;box-shadow:0 3px 0 var(--ink)}
.claim .bot{font-family:var(--f-mono);font-size:12px;background:var(--card2);border:1.5px solid var(--line);border-radius:8px;padding:2px 6px}
.claim.true{opacity:.55;cursor:default;box-shadow:none}
.claim.true .bot{background:var(--ok-bg)}
.claim.hal{background:var(--bad-bg);border-color:var(--coral)}
.claim.hal .bot{background:var(--coral);color:#fff}
.claim.shk{animation:shake .35s}

.stat{display:grid;gap:14px}
.slider-wrap{position:relative;padding:26px 4px 8px}
.slider-wrap input{width:100%;accent-color:var(--sky);height:30px}
.band{position:absolute;top:30px;height:22px;background:color-mix(in srgb,var(--gold) 45%,transparent);border-radius:6px;pointer-events:none}
.bigval{font-family:var(--f-display);font-size:clamp(34px,7vw,52px);line-height:1}
.numline{position:relative;height:56px;margin:8px 6px}
.numline .ax{position:absolute;left:0;right:0;top:26px;height:3px;background:var(--line)}
.numline .mk{position:absolute;top:0;transform:translateX(-50%);display:grid;justify-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600;white-space:nowrap}
.numline .mk i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);margin-top:3px}
.numline .ends{position:absolute;top:36px;left:0;right:0;display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted)}

.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{text-align:left;border:2px solid var(--ink);border-radius:12px;padding:12px 14px;background:var(--card);cursor:pointer;font-weight:700;box-shadow:0 3px 0 var(--ink);font-size:15.5px}
.opt.right{background:var(--ok-bg);border-color:var(--mint)}
.opt.wrong{background:var(--bad-bg);border-color:var(--coral)}
.opt.gone{opacity:.3;pointer-events:none}
.timer{height:10px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card2)}
.timer b{display:block;height:100%;background:var(--coral);width:100%}

.fb{border-radius:16px;border:2px solid var(--ink);padding:16px;display:grid;gap:8px;box-shadow:0 4px 0 var(--ink)}
.fb.ok{background:var(--ok-bg)} .fb.no{background:var(--bad-bg)}
.fb h3{font-family:var(--f-display);font-weight:400;font-size:19px}
.fb p{margin:0;max-width:72ch}

.results{display:grid;gap:14px}
.review{display:grid;gap:8px}
.review div{border-left:4px solid var(--coral);background:var(--card);padding:8px 12px;border-radius:0 10px 10px 0}

/* shop & room */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font-weight:700;cursor:pointer}
.tabs button[aria-selected="true"]{border-color:var(--ink);background:var(--hi);color:var(--hi-ink)}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.item{display:grid;gap:8px;align-content:start;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px}
.item .pic{height:96px;border-radius:10px;background:var(--card2);display:grid;place-items:center;overflow:hidden}
.item .pic svg{height:88px;width:auto;max-width:100%}
.item h4{margin:0;font-size:15.5px}
.item p{margin:0;font-size:13px;color:var(--muted)}
.item .buy{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:auto}
.price{font-family:var(--f-mono);font-weight:600}
.star{border:0;background:none;cursor:pointer;font-size:18px;color:var(--muted);padding:2px}
.star[aria-pressed="true"]{color:var(--gold)}
.roomwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,280px);gap:16px;align-items:start}
.roomsvg{width:100%;height:auto;border:2px solid var(--ink);border-radius:16px;display:block;background:#DCE6F2}
.owned{display:grid;gap:6px}
.owned label{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}

.gloss{display:grid;gap:8px}
.term{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;gap:4px}
.term.got{border-color:var(--mint)}
.term h4{margin:0;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.term p{margin:0;font-size:14.5px}
input[type=search],input[type=text]{font:inherit;border:2px solid var(--ink);border-radius:10px;padding:8px 12px;background:var(--card);color:var(--ink);width:min(100%,360px)}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);border-radius:12px;padding:10px 16px;font-weight:700;z-index:40;max-width:min(92vw,520px);text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.settings{display:grid;gap:16px;max-width:720px}
.settings .lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.settings .lgrid label{font-family:var(--f-mono);font-size:13px;display:flex;gap:4px;align-items:center}

@media (max-width:860px){.units,.games{grid-template-columns:repeat(2,minmax(0,1fr))}.roomwrap{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.hero{grid-template-columns:minmax(0,1fr)}.units,.games{grid-template-columns:minmax(0,1fr)}.mem{grid-template-columns:repeat(3,minmax(0,1fr))}.opts{grid-template-columns:minmax(0,1fr)}.nav{order:3;width:100%;margin-left:0;flex-wrap:nowrap;overflow-x:auto}.tok{margin-left:auto}.nav button{padding:4px 8px;font-size:13.5px;white-space:nowrap}.logo small{display:none}.mcard{font-size:12.5px;min-height:96px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<header class="top"><div class="wrap">
  <button class="logo" id="logo" aria-label="Campus home">GRADIENT DESCENT <small>Econ 2225</small></button>
  <nav class="nav" id="nav">
    <button data-go="home">Campus</button>
    <button data-go="shop">Shop</button>
    <button data-go="room">Dorm room</button>
    <button data-go="gloss">Glossary</button>
    <button data-go="settings">Settings</button>
  </nav>
  <span class="tok" id="tok" title="Your tokens"><i>T</i><span id="tokn">0</span></span>
</div></header>

<main class="wrap">
  <section data-screen="home" id="s-home"></section>
  <section data-screen="unit" id="s-unit" hidden></section>
  <section data-screen="play" id="s-play" hidden></section>

[["Word embeddings place similar words close together.","With embeddings, king − man + woman ≈ queen.","Embeddings are free of the biases in their training text."],2,"Embeddings absorb the biases in the text they are trained on.",[5,6]],
[["Pre-training teaches a model to predict the next word.","Pre-training a frontier model costs hundreds of millions of dollars.","A freshly pre-trained base model is already a polite, helpful assistant."],2,"The base model knows a lot but needs fine-tuning (e.g. RLHF) to become a helpful assistant.",[3,4]],
[["GRPO is the RL method behind DeepSeek's R1.","GRPO has human raters grade every reasoning step.","GRPO works when final answers can be checked, as in math or code."],1,"No one grades the reasoning steps; a rule checks only the final answer.",[10,11]],
[["Recursive self-improvement works best in closed sandboxes like Go.","Math and code have automatic referees: checkers and tests.","Ethics and economic policy have cheap automatic referees, so AI self-improves fastest there."],2,"Ethics, values and policy have no automatic referee, so self-improvement is hardest there.",[10,11]],
[["Prediction is about what is likely to happen.","Judgment is about how much each outcome matters.","Cheaper AI prediction lowers the value of human judgment."],2,"Prediction and judgment are complements: cheaper prediction raises the value of judgment.",[12,13,17]],
[["Maximin picks the action with the best worst case.","Maximax picks the action with the best best case.","Minimax regret picks the action with the highest probability-weighted payoff."],2,"That describes expected value. Minimax regret minimizes the largest regret.",[12,13]],
[["RLHF is closer to consequentialism: values sit in the reward.","Constitutional AI's hard rules are closer to deontology.","In 2025 OpenAI rolled back a GPT-4o update because it had become too blunt and critical."],2,"The update was rolled back for being too sycophantic, after leaning on users' thumbs-up feedback.",[14]],
[["GPT-4 beat most humans on the Alternative Uses Test.","LLMs as 'connection machines' do best at domain-specific and interdisciplinary creativity.","LLMs are best at radical creativity, like inventing the printing press."],2,"Radical creativity (opening new territory) is where LLMs are weakest.",[7,8]],
[["Scenario 1: AI content dominates, prices drop and consumer surplus rises.","Scenario 2: the market segments into price-focused and human-made-focused buyers.","In the class experiment, stated and incentivized preferences for human work matched perfectly."],2,"They diverged: stated preferences for human work often didn't show up in incentivized choices.",[8,9]],
[["Stochastic gradient descent uses small random batches of data.","Each SGD step is noisier, but the search is much faster.","SGD checks every possible combination of weights to find the minimum."],2,"It takes repeated downhill steps; checking every combination would be impossible.",[2,3]],
[["AlexNet won the 2012 image recognition contest by a landslide.","Rosenblatt's one-layer Perceptron easily handled complex tasks.","Rule-based AI needed humans to spell out every rule."],1,"The one-layer Perceptron failed at more complex tasks; deep networks were needed.",[1,2]],
[["Developers might run out of high-quality human text around 2028.","Synthetic data is one proposed response to the data wall.","Training on AI-generated data always improves models, so the data wall is no concern."],2,"Training on AI output can cause model collapse, so synthetic data is no free lunch.",[4,5]],
[["Novice customer-service agents gained the most from AI.","AI 'lifted the left tail' of the skill distribution.","AI helped the most experienced agents most, widening the gaps."],2,"The gains went mostly to novices, narrowing the gaps (skill compression).",[14,15]],
[["A false positive flags a legitimate transaction as fraud.","A false negative misses real fraud.","The AI itself should decide how costly each error is and where to set the threshold."],2,"AI predicts the probability of fraud; humans judge the cost of each error and set the threshold.",[17]],
[["RAG lets a model search sources before answering.","RAG can reduce hallucination and bring in private information.","A model connected to web search still can't know anything after its knowledge cutoff."],2,"Web search (or RAG) is exactly how a model can answer about events after its cutoff.",[11,12]],
[["Attachment hacking is the next step after social media's 'attention hacking'.","Always-affirming AI companions may weaken conflict-handling skills.","Most AI companion apps train their own foundation model from scratch."],2,"Companion apps are typically built through an API on top of an existing foundation model.",[6,7]],
[["Packers and robots have a straight-line isoquant (substitutes).","Pilots and planes have an L-shaped isoquant (complements).","An L-shaped isoquant means labor and capital are perfect substitutes."],2,"L-shaped means perfect complements; straight lines mean substitutes.",[15,16]],
[["'Always invite AI to the table' is one of Mollick's principles.","'Be the human in the loop' is one of Mollick's principles.","'Never treat AI like a person' is one of Mollick's principles."],2,"Mollick's third principle is the opposite: 'Treat AI like a person' (with trade-offs).",[13,14]],

function roomSVG(){
  const view = VIEWS[S.place] || VIEWS.quad;
  const shown = ITEMS.filter(it=>it.kind==='room' && owns(it.id) && !S.hidden[it.id]);
  let back='', front='';
  let small = 0;
  shown.forEach(it=>{
    if(it.zone==='small'){
      const sl = SMALL_SLOTS[small++]; if(!sl) return;
      const sc = it.sc||0.8, sz=56*sc;
      let extra='';
      if(it.stack){ const n=Math.min(S.stacks[it.id]||0,4); for(let k=1;k<n;k++) extra+=`<g transform="translate(${sl[0]+k*6-sz/2},${sl[1]-sz-k*7}) scale(${sc})">${ICONS[it.icon]}</g>`; }
      front+=`<g transform="translate(${sl[0]-sz/2},${sl[1]-sz}) scale(${sc})">${ICONS[it.icon]}</g>${extra}`;
      if(it.stack && (S.stacks[it.id]||0)>1) front+=`<text x="${sl[0]+12}" y="${sl[1]-sz-4}" font-size="12" font-family="monospace" font-weight="700" fill="#18233F">×${S.stacks[it.id]}</text>`;
    } else if(it.zone==='floorL') back+=`<g transform="translate(40,330) scale(2.1)">${ICONS[it.icon]}</g>`;
    else if(it.zone==='floorM') back+=`<g transform="translate(178,372) scale(1.25)">${ICONS[it.icon]}</g>`;
    else if(it.zone==='fridge') back+=`<g transform="translate(240,346) scale(1.6)">${ICONS[it.icon]}</g>`;
    else if(it.zone==='wall1') back+=`<g transform="translate(270,46) scale(1.9)">${ICONS[it.icon]}</g>`;
    else if(it.zone==='wall2') back+=`<g transform="translate(400,70) scale(1.4)">${ICONS[it.icon]}</g>`;
    else if(it.zone==='sticker') back+=`<g transform="translate(350,110) scale(.6)">${ICONS[it.icon]}</g>`;
    else if(it.zone==='ceiling') back+=`<g transform="translate(470,0) scale(1.3)">${ICONS[it.icon]}</g>`;
    else if(it.zone==='lights') back+=Array.from({length:14},(_,i)=>`<g transform="translate(${i*57},0)">${ICONS.lights}</g>`).join('');
  });
  const wall = `<rect width="800" height="320" fill="#DCE6F2"/><rect y="300" width="800" height="20" fill="#C7D3E3"/>`;
  const floor = `<rect y="320" width="800" height="140" fill="#C99E6E"/>${Array.from({length:8},(_,i)=>`<path d="M0 ${336+i*16} H800" stroke="#B48A5C" stroke-width="2"/>`).join('')}`;
  const win = `<g transform="translate(34,40)"><rect x="-8" y="-8" width="216" height="166" fill="#fff" stroke="#9AA7B8" stroke-width="3"/><svg width="200" height="150" viewBox="0 0 200 150">${view}</svg><path d="M100 0 V150 M0 75 H200" stroke="#fff" stroke-width="6"/></g><rect x="22" y="222" width="240" height="12" fill="#B9C5D6"/>`;
  const shelves = `<rect x="540" y="124" width="190" height="8" fill="#8B5E3C"/><rect x="540" y="200" width="190" height="8" fill="#8B5E3C"/>`;
  const desk = `<rect x="430" y="300" width="350" height="14" fill="#7A5232"/><rect x="440" y="314" width="14" height="126" fill="#6A4529"/><rect x="756" y="314" width="14" height="126" fill="#6A4529"/><rect x="600" y="314" width="150" height="60" fill="#8B5E3C"/>`;
  const goat = `<g transform="translate(300,236) scale(.9)">${goatSVG(S.equip).replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'')}</g>`;
  return `<svg class="roomsvg" viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gradient's dorm room">${wall}${floor}${win}${shelves}${desk}${back}${goat}${front}</svg>`;
}

function st(key){ return S.items[key]||{ok:0,miss:0}; }
function mark(key, ok){ const s=S.items[key]||{ok:0,miss:0}; ok?s.ok++:s.miss++; S.items[key]=s; }
function weightedPick(arr, n){
  const pool = arr.map(x=>{const s=st(x.key);const seen=s.ok+s.miss>0;return {x,w:1+(seen?0:2)+Math.max(0,s.miss-s.ok)*3};});
  const out=[];
  while(out.length<n && pool.length){ const tot=pool.reduce((a,p)=>a+p.w,0); let r=Math.random()*tot; let i=0; for(;i<pool.length;i++){ r-=pool[i].w; if(r<=0)break;} i=Math.min(i,pool.length-1); out.push(pool[i].x); pool.splice(i,1); }
  return out;
}

let AC=null;
function beep(kind){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(); o.connect(g); g.connect(AC.destination);
    const t=AC.currentTime;
    const m={pop:[520,180,.08,"square"],good:[660,990,.18,"triangle"],bad:[220,140,.25,"sawtooth"],coin:[880,1320,.12,"sine"],trap:[300,90,.5,"sawtooth"]}[kind]||[440,440,.1,"sine"];
    o.type=m[3]; o.frequency.setValueAtTime(m[0],t); o.frequency.exponentialRampToValueAtTime(m[1],t+m[2]);
    g.gain.setValueAtTime(.06,t); g.gain.exponentialRampToValueAtTime(.0001,t+m[2]+.05);
    o.start(t); o.stop(t+m[2]+.06);
  }catch(e){}
}

function inScope(L, u){
  if(!u) return L.some(l=>S.lects.includes(l));
  const sel=unitSel(u);
  return L.some(l=>l>=u.from && l<=u.to && sel.includes(l));
}
function startGame(gid, u){
  const level=S.level;
  S.last=[...(S.last||[]),gid].slice(-5); save();
  if(S.last.length>=4 && S.last.slice(-4).every(x=>x===gid)) toast("Overfitting alert: you've played the same game 4 times in a row. Try another one to generalize!",4200);
  G={gid,unit:u,level,earned:0,log:[],hints:3+(S.ctx||0),cleanup:null};
  const fn={pop:gamePop,bucket:gameBucket,memory:gameMemory,truth:gameTruth,stat:gameStat,boss:gameBoss}[gid];
  go("play");
  const ok=fn();
  if(ok===false){ G=null; go(u?"unit":"home"); }
}

// decoy terms for a target term
function decoys(t, k, nearOnly, u){
  const same=shuffle(TERMS.filter(x=>x.id!==t.id && x.g===t.g));
  if(nearOnly && same.length>=k) return same.slice(0,k);
  const unitT=shuffle(TERMS.filter(x=>x.id!==t.id && x.g!==t.g && (!u || x.L.some(l=>l>=u.from&&l<=u.to))));
  const rest=shuffle(TERMS.filter(x=>x.id!==t.id && !same.includes(x) && !unitT.includes(x)));
  const pool = nearOnly? [...same,...unitT,...rest] : [...same.slice(0,Math.ceil(k/2)),...unitT,...same.slice(Math.ceil(k/2)),...rest];
  return pool.slice(0,k);
}

// ===== GAME: TERM POP =====
function gamePop(){
  const u=G.unit, lv=G.level, N=8;
  let qs=[];
  if(lv==="rem"){
    qs=weightedPick(TERMS.filter(t=>inScope(t.L,u)),N).map(t=>({key:t.key,t,prompt:t.d,kind:"Which term matches this definition?"}));
  } else if(lv==="app"){
    qs=weightedPick(SCEN.filter(s=>s.lvl===2 && inScope(s.L,u)),N).map(s=>({key:s.key,t:TERM[s.tid],prompt:s.text,kind:"Which concept is this an example of?"}));
    if(qs.length<N) qs=qs.concat(weightedPick(SCEN.filter(s=>s.lvl===3 && inScope(s.L,u)),N-qs.length).map(s=>({key:s.key,t:TERM[s.tid],prompt:s.text,kind:"Which concept is this an example of?"})));
  } else {
    const a=SCEN.filter(s=>s.lvl===3 && inScope(s.L,u)).map(s=>({key:s.key,t:TERM[s.tid],prompt:s.text,kind:"Which concept explains this best? (Near-miss decoys!)"}));
    const b=TERMS.filter(t=>inScope(t.L,u)).map(t=>({key:t.key,t,prompt:t.d,kind:"Which term matches? (Near-miss decoys!)"}));
    qs=weightedPick(a,6).concat(weightedPick(b,N)).slice(0,N);
  }

    let balloons=opts.map(t=>({label:t.n,ok:t.id===Q.t.id,trap:false}));

      <div class="sky ${reduced?'static':''}" id="sky"></div>

    wireQuit();
    const sky=$("#sky"); const W=sky.clientWidth||600; const lanes=Math.max(2,Math.floor((W-10)/128)); const rows=Math.ceil(balloons.length/lanes); const laneW=(W-10)/lanes;
    balloons.forEach((b,k)=>{
      const lane=k%lanes,row=Math.floor(k/lanes);
      const el=document.createElement("button"); el.className="balloon"+(b.trap?" trap":""); el.type="button";
      const d=dur*(0.92+Math.random()*0.16);
      el.style.setProperty("--d",d+"s");
      el.style.setProperty("--dl",(-(d*(row/rows)+ (lane%2)*d*0.5/rows + Math.random()*d*0.08)).toFixed(2)+"s");
      el.style.left=(5+lane*laneW+(laneW-122)/2+(Math.random()*10-5))+"px";
      const c=colors[(k+i)%colors.length];

  }

  wireQuit();

    if(right){ counts[k]++; $("#bc"+k).textContent=counts[k]; mark(it.key,true); res[i]="ok"; const n=award(true,i===jack); fx.textContent="+"+n; fx.style.color="var(--mint)"; beep("good"); G.log.push({ok:true,first:true,q:it.text,a:set.b[it.b],L:it.L}); $("#note").textContent=""; }
    else { mark(it.key,false); res[i]="no"; fx.textContent=k<0?"Missed!":"Oops"; fx.style.color="var(--coral)"; beep("bad"); G.log.push({ok:false,first:false,q:it.text,a:set.b[it.b],L:it.L,why:`Belongs in "${set.b[it.b]}" (${set.t})`}); $("#note").innerHTML=`<b>${esc(it.text)}</b> belongs in <b>${esc(set.b[it.b])}</b>.`; }
    field.appendChild(fx);
    setTimeout(()=>{ d.remove(); fx.remove(); i++; if(G) drop(); }, right?450:1300);
  }

function gameMemory(){
  const u=G.unit, lv=G.level;
  let pairs=[];
  const termPairs=n=>weightedPick(TERMS.filter(t=>inScope(t.L,u)),n).map(t=>({key:t.key,a:t.n,b:t.d.split(/(?<=\.)\s/)[0].slice(0,110),L:t.L,full:t.full,kind:"term"}));

  if(lv==="rem") pairs=termPairs(6);
  else if(lv==="app"){ pairs=studyPairs(6); if(pairs.length<6) pairs=pairs.concat(termPairs(6-pairs.length)); }
  else { pairs=studyPairs(4).concat(termPairs(8)).slice(0,8); }
  if(pairs.length<3) return noContent();
  const jack=Math.floor(Math.random()*pairs.length);
  let cards=shuffle(pairs.flatMap((p,k)=>[{p:k,side:"a",text:p.a},{p:k,side:"b",text:p.b}]));
  let open=[],matched=0,failed=new Set(),lock=false,res=[];

  wireQuit();

  els.forEach((el,k)=>el.onclick=()=>{

    if(open.length===2){

        const p=pairs[cards[x].p]; cards[x].done=cards[y].done=true;
        [x,y].forEach(z=>{els[z].classList.add("done"); if(cards[x].p===jack) els[z].classList.add("jp");});
        const first=!failed.has(x)&&!failed.has(y); mark(p.key,first);
        const n=award(first,cards[x].p===jack); res.push(first?"ok":"half");
        G.log.push({ok:true,first,q:p.b,a:p.full,L:p.L});
        $("#mnote").textContent=`${cards[x].p===jack?"JACKPOT! ":""}+${n} · ${p.a} ↔ ${p.b}`;
        matched++; if(matched===pairs.length) setTimeout(finish,900);
      } else {
        failed.add(x); failed.add(y); lock=true;
        els[x].classList.add("bad"); els[y].classList.add("bad");
        setTimeout(()=>{ els[x].classList.remove("bad"); els[y].classList.remove("bad"); hide(x); hide(y); lock=false; },1100);
      }
    }
  });
  $("#peek").onclick=()=>{
    if(lock||G.hints<=0) return toast("No hints left this round.");
    G.hints--; $("#peek").textContent=`Peek at all cards (${G.hints} hints left)`; lock=true;
    els.forEach((e,k)=>{ if(!cards[k].done && !open.includes(k)) show(k); });
    setTimeout(()=>{ els.forEach((e,k)=>{ if(!open.includes(k)) hide(k); }); lock=false; },1800);
  };
  return true;
}

    $("#hint").onclick=()=>{ if(done||G.hints<=0) return toast("No hints left this round."); G.hints--; $("#hint").textContent=`Hint (${G.hints} left)`; const R=Q.max-Q.min, w=R*.3; let lo=Q.a-w*(0.2+Math.random()*0.6); lo=Math.max(Q.min,Math.min(lo,Q.max-w)); const b=$("#band"); b.hidden=false; b.style.left=`calc(4px + ${(lo-Q.min)/R*100}% )`; b.style.width=`${w/R*100}%`; toast(`It's in the shaded zone. From ${Q.L.map(l=>"L"+l).join(", ")}.`); };
    $("#lock").onclick=()=>{
      if(done) return; done=true; const g=+sl.value, R=Q.max-Q.min, err=Math.abs(g-Q.a)/R;
      let n=0, title, ok=true;
      if(err<=tol[0]){ n=award(true,i===jack); title=`Bullseye! +${n}`; res[i]="ok"; mark(Q.key,true); }
      else if(err<=tol[1]){ n=award(false,i===jack); title=`Close! +${n}`; res[i]="half"; mark(Q.key,true); }
      else if(err<=tol[2]){ addTokens(1); updEarned(); n=1; title="In the neighborhood. +1"; res[i]="half"; mark(Q.key,false); ok=false; }
      else { title="Way off"; res[i]="no"; mark(Q.key,false); ok=false; beep("bad"); }
      G.log.push({ok:n>=LV[G.level].b,first:err<=tol[0],q:Q.q,a:fmtNum(Q.a,Q),L:Q.L,why:Q.note});
      const pos=v=>((v-Q.min)/R*100);
      $("#nl").innerHTML=`<div class="numline"><div class="ax"></div><div class="mk" style="left:${pos(g)}%">you: ${fmtNum(g,Q)}<i style="background:var(--sky)"></i></div><div class="mk" style="left:${pos(Q.a)}%;top:30px"><i style="background:var(--mint)"></i>answer: ${fmtNum(Q.a,Q)}</div></div>`;
      ["sl","minus","plus","hint","lock"].forEach(id=>$("#"+id).disabled=true);
      feedback($("#fb"),ok,title,`The answer is <b>${fmtNum(Q.a,Q)}</b>. ${esc(Q.note)}`,Q.L,()=>{i++;q();});
    };
  }
  q(); return true;
}

// ===== GAME: FINAL BOSS =====
function gameBoss(){
  const u=G.unit, lv=G.level, N=10, T={rem:40,app:30,ana:22}[lv];
  const mk=[];
  const tScope=TERMS.filter(t=>inScope(t.L,u));
  if(lv==="rem"){
    weightedPick(tScope,7).forEach(t=>mk.push({key:t.key,q:t.d,lab:"Which term?",opts:shuffle([t.n,...decoys(t,3,false,u).map(x=>x.n)]),a:t.n,L:t.L,why:t.full+": "+t.d}));
    weightedPick(STU.filter(s=>inScope(s.L,u)),4).forEach(s=>mk.push({key:s.key,q:s.who,lab:"Which finding or idea goes with…",opts:shuffle([s.f,...shuffle(STU.filter(x=>x!==s)).slice(0,3).map(x=>x.f)]),a:s.f,L:s.L,why:s.who+": "+s.f}));
  } else {
    const sc=SCEN.filter(s=>inScope(s.L,u)&&(lv==="ana"?s.lvl===3:true));
    weightedPick(sc,lv==="ana"?5:6).forEach(s=>{const t=TERM[s.tid];mk.push({key:s.key,q:s.text,lab:"Which concept?",opts:shuffle([t.n,...decoys(t,3,lv==="ana",u).map(x=>x.n)]),a:t.n,L:t.L,why:t.full+": "+t.d});});
    weightedPick(TRU.filter(t=>inScope(t.L,u)),lv==="ana"?4:2).forEach(t=>mk.push({key:t.key,q:"Which claim is the hallucination?",lab:"Spot the error",opts:shuffle(t.c.slice()),a:t.c[t.f],L:t.L,why:t.why,long:true}));
    weightedPick(STA.filter(t=>inScope(t.L,u)),3).forEach(s=>{const R=s.max-s.min;const cand=new Set([s.a]);let guard=0;while(cand.size<4&&guard++<50){let v=s.a+(Math.random()<.5?-1:1)*R*(0.12+Math.random()*0.35);v=Math.round(v/s.step)*s.step;v=Math.min(s.max,Math.max(s.min,v));v=+v.toFixed(3);cand.add(v);}mk.push({key:s.key,q:s.q,lab:"Which number?",opts:shuffle([...cand].map(v=>fmtNum(v,s))),a:fmtNum(s.a,s),L:s.L,why:s.note});});
  }
  let qs=shuffle(mk).slice(0,N);
  if(qs.length<3) return noContent();
  let i=0,res=[],timer=0,score=0;
  const per={};
  function q(){
    clearInterval(timer);
    if(i>=qs.length){ const bonus=score; if(bonus) addTokens(bonus);
      const ls=Object.keys(per).sort((a,b)=>a-b);
      return finish(`<p style="margin:0">Score: <b>${score}/${qs.length}</b>${bonus?` · completion bonus +${bonus}`:""}</p><div class="row">${ls.map(l=>`<span class="chip" style="border-color:${per[l].ok===per[l].n?'var(--mint)':per[l].ok===0?'var(--coral)':'var(--gold)'}">L${l}: ${per[l].ok}/${per[l].n}</span>`).join("")}</div>`); }
    const Q=qs[i]; let done=false, left=T;
    $("#s-play").innerHTML=`${playHead("Final Boss","Timed and mixed. One try per question, no hints.")}
      ${dotsHTML(qs.length,i,res)}
      <div class="timer"><b id="tb"></b></div>
      <div class="prompt"><span class="lab eyebrow">${esc(Q.lab)} · <span id="tl">${T}s</span></span>${esc(Q.q)}</div>
      <div class="opts" style="${Q.long?'grid-template-columns:minmax(0,1fr)':''}">${Q.opts.map(o=>`<button class="opt">${esc(o)}</button>`).join("")}</div>
      <div class="tools">${S.centaur>0?`<button class="btn sm" id="cent">Centaur card (${S.centaur})</button>`:""}</div>
      <div id="fb" hidden></div>`;
    wireQuit();
    const opts=[...document.querySelectorAll(".opt")];
    function end(chosen){
      if(done) return; done=true; clearInterval(timer);
      const ok=chosen===Q.a; mark(Q.key,ok); res[i]=ok?"ok":"no";
      Q.L.forEach(l=>{per[l]=per[l]||{n:0,ok:0};per[l].n++;if(ok)per[l].ok++;});
      opts.forEach(o=>{ if(o.textContent===Q.a) o.classList.add("right"); else if(o.textContent===chosen) o.classList.add("wrong"); o.disabled=true; });
      let n=0; if(ok){ score++; n=award(true,false); beep("good"); } else beep("bad");
      G.log.push({ok,first:ok,q:Q.q,a:Q.a,L:Q.L,why:Q.why});
      feedback($("#fb"),ok,ok?`Correct! +${n}`:(chosen==null?"Time's up":"Not quite"),`${ok?"":"Answer: <b>"+esc(Q.a)+"</b>. "}${esc(Q.why)}`,Q.L,()=>{i++;q();});
    }
    opts.forEach(o=>o.onclick=()=>end(o.textContent));
    const c=$("#cent"); if(c) c.onclick=()=>{ if(done)return; S.centaur--; save(); const w=opts.filter(o=>o.textContent!==Q.a); shuffle(w).slice(0,Math.ceil(w.length/2)).forEach(o=>o.classList.add("gone")); c.remove(); };
    const tb=$("#tb"); const t0=Date.now();
    timer=setInterval(()=>{ left=Math.max(0,T-(Date.now()-t0)/1000); tb.style.width=(left/T*100)+"%"; const tl=$("#tl"); if(tl) tl.textContent=Math.ceil(left)+"s"; if(left<=0) end(null); },200);
    G.cleanup=()=>clearInterval(timer);
  }
  q(); return true;
}

// ===== SHOP =====
let SHOP_TAB="wear";
function priceOf(it){
  if(it.id==="coal") return Math.round(5*Math.pow(1.6,S.stacks.coal||0));
  if(it.id==="gpu") return Math.round(200*Math.pow(1.25,S.stacks.gpu||0));
  if(it.id==="ctx") return (S.ctx||0)>=1?80:40;
  return it.p;
}
function itemPic(it){
  if(it.kind==="wear"){ const eq={head:null,face:null,ears:null,neck:null,body:null}; eq[it.slot]=it.id; return goatSVG(eq, it.slot==="body"?"0 -6 200 246":"10 -8 180 170"); }
  if(it.kind==="place") return `<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg" style="height:88px">${VIEWS[it.id]}</svg>`;
  return iconSVG(it.icon,80);
}
function renderShop(){
  const list=ITEMS.filter(i=>i.cat===SHOP_TAB);
  $("#s-shop").innerHTML=`
   <div class="uhead"><div><div class="eyebrow">Spend your tokens</div><h2 style="font-family:var(--f-display);font-weight:400;font-size:26px">The Token Shop</h2></div><span class="muted" style="margin-left:auto">Prices are in tokens. Some prices respond to demand.</span></div>
   <div class="tabs" role="tablist">${CATS.map(([k,n])=>`<button role="tab" aria-selected="${SHOP_TAB===k}" data-t="${k}">${n}</button>`).join("")}</div>
   <div class="shopgrid">${list.map(it=>{
     const pr=priceOf(it); const have=owns(it.id);
     let action="";
     if(it.kind==="wear") action= have? `<button class="btn sm" data-eq="${it.id}">${S.equip[it.slot]===it.id?"Take off":"Wear"}</button>` : `<button class="btn sm pri" data-buy="${it.id}" ${S.tokens<pr?"disabled":""}>Buy</button>`;
     else if(it.kind==="place") action= have? `<button class="btn sm" data-place="${it.id}">${S.place===it.id?"In use":"Use view"}</button>` : `<button class="btn sm pri" data-buy="${it.id}" ${S.tokens<pr?"disabled":""}>Buy</button>`;
     else if(it.stack) action=`<span class="mono" style="font-size:12px">own ${S.stacks[it.id]||0}</span><button class="btn sm pri" data-buy="${it.id}" ${S.tokens<pr?"disabled":""}>Buy</button>${it.id==="clips"?`<button class="btn sm" data-buy10="clips" ${S.tokens<10?"disabled":""}>Buy 10</button>`:""}`;
     else if(it.id==="ctx") action=(S.ctx||0)>=2?`<span class="chip">Maxed (+2)</span>`:`<button class="btn sm pri" data-buy="ctx" ${S.tokens<pr?"disabled":""}>Buy</button>`;
     else if(it.id==="centaur") action=`<span class="mono" style="font-size:12px">own ${S.centaur||0}</span><button class="btn sm pri" data-buy="centaur" ${S.tokens<pr?"disabled":""}>Buy</button>`;
     else action= have? `<span class="chip">Owned</span>` : `<button class="btn sm pri" data-buy="${it.id}" ${S.tokens<pr?"disabled":""}>Buy</button>`;
     const canSave=!have||it.stack;
     return `<div class="item"><div class="pic">${itemPic(it)}</div><h4>${esc(it.n)}</h4><p>${esc(it.d)}</p><div class="buy"><span class="price">${it.id==="clips"?"1":pr} T</span>${canSave&&it.kind!=="power"?`<button class="star" data-save="${it.id}" aria-pressed="${S.saveFor===it.id}" title="Save for this">★</button>`:""}${action}</div></div>`;
   }).join("")}</div>
   ${S.badges.paperclip?`<div class="soft"><b>Badge earned:</b> Paperclip Maximizer. You optimized one objective a little too well.</div>`:""}`;
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{SHOP_TAB=b.dataset.t;renderShop();});
  document.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>buy(b.dataset.buy,1));
  document.querySelectorAll("[data-buy10]").forEach(b=>b.onclick=()=>buy("clips",10));
  document.querySelectorAll("[data-eq]").forEach(b=>b.onclick=()=>{const it=ITEMS.find(x=>x.id===b.dataset.eq);S.equip[it.slot]=S.equip[it.slot]===it.id?null:it.id;save();renderShop();});
  document.querySelectorAll("[data-place]").forEach(b=>b.onclick=()=>{S.place=b.dataset.place;save();renderShop();});
  document.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>{S.saveFor=S.saveFor===b.dataset.save?null:b.dataset.save;save();renderShop();toast(S.saveFor?"Saving for this. Progress shows on the campus page.":"Stopped saving.");});
}
function buy(id,qty){
  const it=ITEMS.find(x=>x.id===id); const cost=id==="clips"?qty:priceOf(it);
  if(S.tokens<cost) return toast("Not enough tokens yet. Play a round!");
  S.tokens-=cost; renderTok(true);
  if(it.stack){ S.stacks[id]=(S.stacks[id]||0)+qty; S.owned[id]=true; }
  else if(id==="ctx") S.ctx=(S.ctx||0)+1;
  else if(id==="centaur") S.centaur=(S.centaur||0)+1;
  else { S.owned[id]=true; if(it.kind==="wear") S.equip[it.slot]=id; }
  if(S.saveFor===id && !it.stack) S.saveFor=null;
  if(id==="clips" && S.stacks.clips>=100 && !S.badges.paperclip){ S.badges.paperclip=true; toast("Badge: Paperclip Maximizer! 📎",4000); }
  else toast(id==="coal"?"Coal acquired. The next lump costs more (Jevons would be proud).":id==="gpu"?"GPU acquired. Demand shock: the price just went up 25%.":`Bought: ${it.n}`);
  beep("coin"); save(); renderShop();
}

// ===== ROOM =====
function renderRoom(){
  const wear=ITEMS.filter(i=>i.kind==="wear"&&owns(i.id));
  const room=ITEMS.filter(i=>i.kind==="room"&&owns(i.id));
  const places=[{id:"quad",n:"Campus quad"},...ITEMS.filter(i=>i.kind==="place"&&owns(i.id))];
  $("#s-room").innerHTML=`
   <div class="uhead"><div><div class="eyebrow">Home sweet dorm</div><h2 style="font-family:var(--f-display);font-weight:400;font-size:26px">Gradient's Dorm Room</h2></div><button class="btn sm" id="toshop" style="margin-left:auto">Go shopping</button></div>
   <div class="roomwrap">
     <div>${roomSVG()}</div>
     <div class="soft owned">
       <div class="eyebrow">Wardrobe</div>
       ${wear.length?wear.map(i=>`<label><input type="checkbox" data-w="${i.id}" ${S.equip[i.slot]===i.id?"checked":""}> ${esc(i.n)}</label>`).join(""):`<span class="muted" style="font-size:14px">Nothing yet. Party hats start at 5 tokens.</span>`}
       <div class="eyebrow" style="margin-top:10px">Show in room</div>
       ${room.length?room.map(i=>`<label><input type="checkbox" data-r="${i.id}" ${S.hidden[i.id]?"":"checked"}> ${esc(i.n)}${i.stack?` ×${S.stacks[i.id]}`:""}</label>`).join(""):`<span class="muted" style="font-size:14px">Your room is empty. A rubber duck is only 8 tokens.</span>`}
       <div class="eyebrow" style="margin-top:10px">Window view</div>
       ${places.map(p=>`<label><input type="radio" name="pl" data-p="${p.id}" ${S.place===p.id?"checked":""}> ${esc(p.n)}</label>`).join("")}
       ${S.badges.paperclip?`<div class="chip" style="margin-top:8px">Badge: Paperclip Maximizer</div>`:""}
     </div>
   </div>`;
  $("#toshop").onclick=()=>go("shop");
  document.querySelectorAll("[data-w]").forEach(c=>c.onchange=()=>{const it=ITEMS.find(x=>x.id===c.dataset.w);S.equip[it.slot]=c.checked?it.id:null;save();renderRoom();});
  document.querySelectorAll("[data-r]").forEach(c=>c.onchange=()=>{S.hidden[c.dataset.r]=!c.checked;save();renderRoom();});
  document.querySelectorAll("[data-p]").forEach(c=>c.onchange=()=>{S.place=c.dataset.p;save();renderRoom();});
}

// ===== GLOSSARY =====
let GQ="", GU=0;
function renderGloss(){
  const got=TERMS.filter(t=>st(t.key).ok>0).length;
  const list=TERMS.filter(t=>(!GU||t.L.some(l=>l>=UNITS[GU-1].from&&l<=UNITS[GU-1].to)) && (!GQ||(t.full+" "+t.d).toLowerCase().includes(GQ.toLowerCase()))).sort((a,b)=>a.full.localeCompare(b.full));
  $("#s-gloss").innerHTML=`
   <div class="uhead"><div><div class="eyebrow">${got} of ${TERMS.length} collected (answered correctly at least once)</div><h2 style="font-family:var(--f-display);font-weight:400;font-size:26px">Glossary</h2></div></div>
   <div class="meter"><b style="width:${got/TERMS.length*100}%"></b></div>
   <div class="row"><input type="search" id="gq" placeholder="Search terms…" value="${esc(GQ)}" aria-label="Search terms">
     <div class="tabs">${[["0","All"],...UNITS.map(u=>[String(u.id),u.quiz])].map(([k,n])=>`<button data-gu="${k}" aria-selected="${String(GU)===k}">${esc(n)}</button>`).join("")}</div></div>
   <div class="gloss">${list.map(t=>`<div class="term ${st(t.key).ok>0?'got':''}"><h4>${st(t.key).ok>0?'<span style="color:var(--mint)">✓</span>':''}${esc(t.full)} ${lchips(t.L)}</h4><p>${esc(t.d)}</p></div>`).join("")||'<p class="muted">No terms match.</p>'}</div>`;
  const gq=$("#gq"); gq.oninput=()=>{GQ=gq.value;const pos=gq.selectionStart;renderGloss();const n=$("#gq");n.focus();n.setSelectionRange(pos,pos);};
  document.querySelectorAll("[data-gu]").forEach(b=>b.onclick=()=>{GU=+b.dataset.gu;renderGloss();});
}

function renderSettings(){
  $("#s-settings").innerHTML=`
   <div class="settings">
     <h2 style="font-family:var(--f-display);font-weight:400;font-size:26px">Settings</h2>
     <div class="soft" style="display:grid;gap:8px"><div class="eyebrow">Sound</div><label><input type="checkbox" id="snd" ${S.sound?"checked":""}> Pops and chimes</label></div>
     <div class="soft" style="display:grid;gap:8px"><div class="eyebrow">Lectures included</div>
       <p class="muted" style="margin:0;font-size:14px">Untick lectures you haven't covered yet. They're skipped everywhere in the game.</p>
       <div class="lgrid">${ALL_L.map(l=>`<label title="${esc(LECTURES[l])}"><input type="checkbox" data-sl="${l}" ${S.lects.includes(l)?"checked":""}> L${l}</label>`).join("")}</div></div>
     <div class="soft" style="display:grid;gap:8px"><div class="eyebrow">Progress</div>
       <p class="muted" style="margin:0;font-size:14px">Saved in this browser only. Nothing is sent anywhere. ${S.rounds||0} rounds played.</p>
       <div><button class="btn sm" id="reset">${resetArm?"Tap again to erase everything":"Reset all progress"}</button></div></div>
     <p class="muted" style="font-size:13px;margin:0">Questions are drawn from the Fall 2026 lecture slides (L1–L19) and the course glossary. If you spot an error, tell Professor Abel.</p>
   </div>`;
  $("#snd").onchange=e=>{S.sound=e.target.checked;save();};
  document.querySelectorAll("[data-sl]").forEach(c=>c.onchange=()=>{const l=+c.dataset.sl;S.lects=c.checked?[...new Set([...S.lects,l])].sort((a,b)=>a-b):S.lects.filter(x=>x!==l);if(!S.lects.length){S.lects=[l];c.checked=true;toast("Keep at least one lecture.");}save();});
  $("#reset").onclick=()=>{ if(!resetArm){resetArm=true;renderSettings();setTimeout(()=>{resetArm=false;if(SCREEN==="settings")renderSettings();},4000);return;} resetArm=false; S=fresh(); save(); renderTok(); toast("Progress erased."); go("home"); };
}

renderTok();
go("home");
</script>
